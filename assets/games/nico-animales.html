<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>¡Encuentra los animales de Nico! – Tim Marín</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#8fd4ff;
  font-family:"Baloo 2","Chalkboard SE","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font-family:inherit;cursor:pointer;border:0;touch-action:manipulation}
button:focus-visible{outline:5px solid #2b6cff;outline-offset:4px}
#app{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#5fc3ff 0%,#bfe8ff 55%,#eafaff 75%)}
#bg{position:absolute;inset:0;width:100%;height:100%}
.cloud{animation:drift 28s ease-in-out infinite alternate}
.cloud.c2{animation-duration:36s;animation-direction:alternate-reverse}
.cloud.c3{animation-duration:44s}
@keyframes drift{from{transform:translateX(-70px)}to{transform:translateX(90px)}}
.sunglow{animation:glow 4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes glow{from{transform:scale(.92);opacity:.55}to{transform:scale(1.08);opacity:.9}}

/* gold star shape */
.gstar{display:inline-block;width:1em;height:1em;vertical-align:-.12em;
  background:radial-gradient(circle at 35% 30%,#fffbc2,#ffd22e 45%,#e58f00);
  clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  filter:drop-shadow(0 2px 0 #b46a00)}
.gstar.off{background:#fff;opacity:.55;filter:none}

/* HUD */
#hud{position:absolute;z-index:6;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:none;
  align-items:center;gap:10px}
.s-play #hud{display:flex}
#stars{background:#fff;border-radius:999px;padding:4px 18px 4px 12px;font-size:clamp(26px,5.5vmin,44px);font-weight:800;
  color:#d97a00;box-shadow:0 5px 0 rgba(0,0,0,.15);display:flex;align-items:center;gap:8px;line-height:1.2}
#stars.pulse{animation:pulse .5s}
@keyframes pulse{40%{transform:scale(1.25) rotate(-4deg)}}
#prog{flex:1;height:clamp(14px,2.6vmin,22px);background:rgba(255,255,255,.7);border-radius:99px;overflow:hidden;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.15)}
#progbar{height:100%;width:0;background:linear-gradient(90deg,#ffd22e,#ff9f1c);border-radius:99px;transition:width .6s}
.rbtn{width:clamp(52px,10vmin,76px);height:clamp(52px,10vmin,76px);border-radius:50%;background:#fff;
  font-size:clamp(26px,5vmin,38px);box-shadow:0 5px 0 rgba(0,0,0,.15);display:grid;place-items:center;padding:0}
.rbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.15)}

/* Nico */
#nicoWrap{position:absolute;z-index:3;pointer-events:none;
  transition:left .7s cubic-bezier(.3,1.3,.5,1),height .7s cubic-bezier(.3,1.3,.5,1),bottom .7s,transform .7s}
#nico{height:100%;width:auto;display:block;transform-origin:50% 100%;
  filter:drop-shadow(0 8px 6px rgba(0,60,0,.25));animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1) rotate(0)}50%{transform:scale(1.015,1.03) rotate(-1deg)}}
#nico.wave{animation:wave 1.4s ease-in-out}
@keyframes wave{0%,100%{transform:rotate(0)}15%{transform:rotate(-6deg) translateY(-2%)}35%{transform:rotate(5deg)}55%{transform:rotate(-5deg) translateY(-2%)}75%{transform:rotate(4deg)}}
#nico.cheer{animation:cheer 1.1s ease-in-out}
@keyframes cheer{0%{transform:translateY(0) scale(1,1)}15%{transform:translateY(0) scale(1.05,.93)}
  40%{transform:translateY(-9%) scale(.97,1.05) rotate(-4deg)}60%{transform:translateY(-3%) rotate(4deg)}
  78%{transform:translateY(-8%) rotate(-3deg)}100%{transform:translateY(0) scale(1,1)}}
#nico.oops{animation:oops .9s ease-in-out}
@keyframes oops{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg) translateX(-2%)}60%{transform:rotate(3deg)}}
#nico.talk{animation:talk .45s ease-in-out 3}
@keyframes talk{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5%)}}

.s-welcome #nicoWrap{height:44vh;bottom:1vh;left:50%;transform:translateX(-50%)}
.s-play #nicoWrap{height:33vh;bottom:.5vh;left:1vw;transform:none}
.s-final #nicoWrap{height:40vh;bottom:1vh;left:50%;transform:translateX(-50%)}

/* Screens / cards */
.screen{position:absolute;inset:0;z-index:5;display:none;pointer-events:none}
.s-welcome #welcome,.s-final #final{display:block}
.card{position:absolute;left:50%;top:max(14px,3vh);transform:translateX(-50%);width:min(92vw,720px);
  background:rgba(255,255,255,.93);border-radius:36px;padding:clamp(14px,3vmin,30px) clamp(16px,3vmin,34px);
  text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.12),0 18px 40px rgba(0,60,120,.25);pointer-events:auto;
  animation:cardin .7s cubic-bezier(.3,1.5,.5,1)}
@keyframes cardin{from{transform:translateX(-50%) scale(.6);opacity:0}}
.brand{display:inline-block;background:#ff3b3b;color:#fff;font-weight:800;border-radius:99px;padding:2px 18px;
  font-size:clamp(16px,3vmin,24px);letter-spacing:.5px;margin-bottom:6px}
h1{margin:4px 0 4px;color:#e8192c;font-size:clamp(30px,7.2vmin,64px);line-height:1.02;
  text-shadow:0 3px 0 #ffd22e}
.sub{margin:6px 0 14px;color:#34517a;font-size:clamp(18px,3.6vmin,30px);font-weight:700}
.big{background:linear-gradient(#5be36b,#26b83b);color:#fff;font-weight:800;border-radius:999px;
  font-size:clamp(28px,6vmin,54px);padding:clamp(10px,2vmin,18px) clamp(26px,6vmin,60px);
  box-shadow:0 8px 0 #178a2a,0 14px 22px rgba(0,0,0,.25);text-shadow:0 3px 0 rgba(0,0,0,.2);
  animation:bob 1.6s ease-in-out infinite;min-height:64px}
.big:active{transform:translateY(6px);box-shadow:0 2px 0 #178a2a}
@keyframes bob{50%{transform:scale(1.06)}}
.hint{margin-top:10px;color:#6b7c93;font-size:clamp(14px,2.4vmin,20px);font-weight:600}

/* Play */
#play{position:absolute;inset:0;z-index:4;display:none}
.s-play #play{display:block}
#bubble{position:absolute;left:50%;top:calc(max(10px,env(safe-area-inset-top)) + clamp(64px,12vmin,92px));
  transform:translateX(-50%);width:min(94vw,900px);background:#fff;border-radius:34px;
  padding:clamp(10px,2.4vmin,22px) clamp(16px,3vmin,32px);text-align:center;
  font-size:clamp(24px,5.2vmin,52px);font-weight:800;color:#2a3f66;line-height:1.12;
  box-shadow:0 7px 0 rgba(0,0,0,.14),0 14px 28px rgba(0,60,120,.2);min-height:2.6em;display:flex;
  align-items:center;justify-content:center}
#bubble::after{content:"";position:absolute;left:12%;bottom:-22px;border:14px solid transparent;border-top:22px solid #fff;border-bottom:0}
#bubble.good{background:#eaffe9;color:#12852a}
#bubble.bad{background:#fff6e0;color:#b65a00}
#bubble.pop{animation:bpop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes bpop{from{transform:translateX(-50%) scale(.85)}}
#choices{position:absolute;display:flex;justify-content:center;align-items:flex-end;gap:2vw}
.animal{position:relative;flex:1 1 0;aspect-ratio:1/1;background:none;padding:0;border-radius:30px;
  filter:drop-shadow(0 8px 6px rgba(0,50,0,.28));transition:transform .15s,opacity .3s,filter .3s;
  animation:appear .6s cubic-bezier(.3,1.6,.5,1) backwards}
.animal:nth-child(2){animation-delay:.1s}.animal:nth-child(3){animation-delay:.2s}
@keyframes appear{from{transform:scale(0) translateY(40px)}}
.animal svg{width:100%;height:100%;display:block;animation:idle 2.6s ease-in-out infinite;transform-origin:50% 100%}
.animal:nth-child(2) svg{animation-delay:-.9s}.animal:nth-child(3) svg{animation-delay:-1.7s}
@keyframes idle{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
.animal:hover{transform:scale(1.07)}
.animal:active{transform:scale(.94)}
.animal.shake{animation:shake .5s}
@keyframes shake{20%{transform:translateX(-12px) rotate(-4deg)}40%{transform:translateX(12px) rotate(4deg)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.animal.tried{opacity:.45;filter:grayscale(.5) drop-shadow(0 4px 3px rgba(0,50,0,.2));pointer-events:none}
.animal.win svg{animation:win 1s ease-in-out infinite}
.animal.win{z-index:2;transform:scale(1.12)}
@keyframes win{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-14%) rotate(-5deg)}75%{transform:translateY(-14%) rotate(5deg)}}
.animal.fade{opacity:.0;transform:scale(.6);pointer-events:none}

/* final */
#finalStars{white-space:nowrap;font-size:clamp(22px,min(7vmin,7.2vw),60px);margin:6px 0 10px;line-height:1.1}
#finalStars .gstar{margin:0 2px;animation:starin .5s cubic-bezier(.3,1.8,.5,1) backwards}
@keyframes starin{from{transform:scale(0) rotate(-180deg)}}
#finalMsg{margin:0 0 12px;color:#e8192c;font-weight:800;font-size:clamp(22px,4.6vmin,40px);line-height:1.1}

/* effects */
#fx{position:absolute;inset:0;z-index:20;pointer-events:none;overflow:hidden}
.spark{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;
  clip-path:polygon(50% 0%,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0% 50%,38% 38%)}
.flystar{position:absolute;font-size:clamp(50px,11vmin,90px);margin:-.5em 0 0 -.5em;z-index:21}
.conf{position:absolute;top:-24px;width:14px;height:22px;border-radius:3px}

@media (orientation:landscape){
  .s-welcome #nicoWrap{height:78vh;left:70%}
  .s-welcome .card{left:34%;top:50%;width:min(60vw,720px);transform:translate(-50%,-50%);animation:cardinL .7s cubic-bezier(.3,1.5,.5,1)}
  .s-final #nicoWrap{height:74vh;left:72%}
  .s-final .card{left:34%;top:50%;width:min(60vw,720px);transform:translate(-50%,-50%);animation:cardinL .7s cubic-bezier(.3,1.5,.5,1)}
  @keyframes cardinL{from{transform:translate(-50%,-50%) scale(.6);opacity:0}}
  .s-play #nicoWrap{height:min(58vh,330px);left:1.5vw}
  #bubble{left:calc(50% + 11vw);width:min(74vw,860px);font-size:clamp(22px,4.6vmin,48px)}
  #choices{left:25vw;right:1vw;bottom:5vh}
  .animal{max-width:min(23vw,40vh)}
}
@media (orientation:portrait){
  #choices{left:0;right:0;bottom:31vh;gap:0}
  .animal{max-width:34vw}
  .s-play #nicoWrap{height:30vh;left:3vw}
}
@media (max-height:420px) and (orientation:landscape){
  .s-welcome .card,.s-final .card{padding:10px 18px}
  .big{min-height:52px}
}
@media (prefers-reduced-motion:reduce){
  .cloud,.sunglow,.animal svg,#nico,.big{animation:none!important}
}
</style>
</head>

/* ---------- Garden background ---------- */
(function buildGarden(){
  let seed = 7; const r = ()=>{ seed=(seed*16807)%2147483647; return (seed-1)/2147483646; };
  const tree = (x,y,s)=>`<g transform="translate(${x} ${y}) scale(${s})">
     <linearGradient id="tr${x}" x1="0" x2="1"><stop offset="0" stop-color="#b9783e"/><stop offset="1" stop-color="#8a5226"/></linearGradient>
     <rect x="-14" y="-60" width="28" height="70" rx="12" fill="url(#tr${x})"/>
     ${E(0,-150,76,66,'#3fae4a')}${E(-52,-115,48,42,'#4cbc52')}${E(52,-115,48,42,'#4cbc52')}${E(0,-185,48,40,'#5ccb5f')}
     ${E(-24,-140,10,10,'#e8412f')}${E(30,-120,10,10,'#e8412f')}${E(8,-170,10,10,'#e8412f')}</g>`;
  const flower = (x,y,s,c)=>{ let p=''; for(let i=0;i<5;i++){const a=i*72*Math.PI/180; p+=`<circle cx="${(Math.cos(a)*7).toFixed(1)}" cy="${(Math.sin(a)*7).toFixed(1)}" r="6" fill="${c}"/>`;}
     return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 0 V26" stroke="#2e9a3a" stroke-width="3"/>${p}<circle r="4.5" fill="#ffd93b"/><circle cx="-1.5" cy="-1.5" r="1.5" fill="#fff8b0"/></g>`; };
  const cloud = (x,y,s,cls)=>`<g class="cloud ${cls}"><g transform="translate(${x} ${y}) scale(${s})" fill="#fff" opacity=".95">
     <ellipse cx="0" cy="0" rx="70" ry="30"/><ellipse cx="-40" cy="10" rx="45" ry="24"/><ellipse cx="45" cy="8" rx="52" ry="26"/><ellipse cx="10" cy="-22" rx="40" ry="28"/></g></g>`;
  let s = `<defs>
    <radialGradient id="sun"><stop offset="0" stop-color="#fffbd0"/><stop offset=".6" stop-color="#ffe55c"/><stop offset="1" stop-color="#ffc21a"/></radialGradient>
    <radialGradient id="sunhalo"><stop offset="0" stop-color="#fff6a8" stop-opacity=".9"/><stop offset="1" stop-color="#fff6a8" stop-opacity="0"/></radialGradient>
    <linearGradient id="h1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a6e87f"/><stop offset="1" stop-color="#6fcb52"/></linearGradient>
    <linearGradient id="h2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#86dc62"/><stop offset="1" stop-color="#52b941"/></linearGradient>
    <linearGradient id="h3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fd150"/><stop offset="1" stop-color="#3ea53a"/></linearGradient></defs>`;
  s += `<circle class="sunglow" cx="1370" cy="140" r="170" fill="url(#sunhalo)"/><circle cx="1370" cy="140" r="72" fill="url(#sun)"/>`;
  s += `<g fill="none" stroke-width="16" opacity=".55" stroke-linecap="round"><path d="M120 640 A330 330 0 0 1 780 640" stroke="#ff6b6b"/><path d="M136 640 A314 314 0 0 1 764 640" stroke="#ffb347"/><path d="M152 640 A298 298 0 0 1 748 640" stroke="#ffe45c"/><path d="M168 640 A282 282 0 0 1 732 640" stroke="#7bdc65"/><path d="M184 640 A266 266 0 0 1 716 640" stroke="#5cb8ff"/></g>`;
  s += cloud(260,130,1.1,'c1')+cloud(780,80,.8,'c2')+cloud(1120,210,1,'c3');
  s += `<path d="M0 560 Q220 470 480 540 T980 520 T1600 500 V900 H0Z" fill="url(#h1)"/>`;
  s += tree(1230,560,.8)+tree(1400,585,.62)+tree(120,575,.7);
  s += `<path d="M0 640 Q300 560 640 620 T1250 600 T1600 620 V900 H0Z" fill="url(#h2)"/>`;
  s += tree(1480,650,.95)+tree(300,660,1.05);
  s += `<path d="M0 730 Q400 670 800 720 T1600 700 V900 H0Z" fill="url(#h3)"/>`;
  const cols = ['#ff5d8f','#ff9f1c','#ffffff','#b47bff','#ff6b6b','#5cc8ff','#ffe14d'];
  const fl = []; for(let i=0;i<64;i++){ const y=640+r()*250; const sc=.55+(y-640)/250*.9; fl.push([r()*1600,y,sc,cols[Math.floor(r()*cols.length)]]); }
  fl.sort((a,b)=>a[1]-b[1]).forEach(f=>{ s+=flower(f[0].toFixed(0),f[1].toFixed(0),f[2].toFixed(2),f[3]); });
  for(let i=0;i<40;i++){ const x=r()*1600,y=700+r()*190; s+=`<path d="M${x} ${y} l-6 -22 l8 14 l2 -18 l5 20 l8 -12 l-4 18Z" fill="#3a9d37" opacity=".8"/>`; }
  $('#bg').innerHTML = s;
})();

/* ---------- Audio (Web Audio, nothing external) ---------- */
let ac = null, soundOn = true;
function audio(){ if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(ac && ac.state==='suspended') ac.resume(); return ac; }
function tone(f,t0,d,type='sine',v=.2,slide){ const c=audio(); if(!c||!soundOn) return;
  const o=c.createOscillator(), g=c.createGain(), t=c.currentTime+t0; o.type=type; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+.05); }
const sfx = {
  pop(){ tone(500,0,.14,'sine',.25,950); },
  good(){ [523,659,784,1047,1319].forEach((f,i)=>{ tone(f,i*.09,.4,'triangle',.22); tone(f*2,i*.09,.28,'sine',.07); }); tone(2093,.5,.45,'sine',.06); },
  bad(){ tone(330,0,.2,'sine',.17,270); tone(262,.2,.32,'sine',.15,215); },
  star(){ tone(1568,0,.16,'sine',.15); tone(2093,.1,.32,'sine',.12); },
  win(){ [[523,0],[523,.14],[784,.28],[659,.5],[784,.64],[1047,.8],[988,1.05],[1047,1.2],[1319,1.4],[1568,1.65]].forEach(([f,t])=>{ tone(f,t,.4,'triangle',.22); tone(f/2,t,.4,'sine',.1); }); }
};

/* ---------- Voice (browser speech, local; optional) ---------- */
function say(text){
  if(!soundOn || !('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[¡¿]/g,''));
    const vs = speechSynthesis.getVoices();
    const v = vs.find(x=>/^es[-_](MX|US|CO|419)/i.test(x.lang)) || vs.find(x=>/^es/i.test(x.lang));
    if(v) u.voice = v; u.lang = v ? v.lang : 'es-MX';
    u.rate = .88; u.pitch = 1.3; u.volume = 1;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- Nico animation ---------- */
function nicoDo(cls){ nico.classList.remove('wave','cheer','oops','talk'); void nico.offsetWidth; nico.classList.add(cls); }

/* ---------- Effects ---------- */
function centerOf(el){ const b=el.getBoundingClientRect(), a=app.getBoundingClientRect(); return { x:b.left-a.left+b.width/2, y:b.top-a.top+b.height/2, w:b.width, h:b.height }; }
function sparkles(x,y,n=22){
  const cols=['#ffd22e','#fff6a8','#ff8fb8','#8be8ff','#ffffff','#b6ff8a'];
  for(let i=0;i<n;i++){
    const p=document.createElement('div'); p.className='spark'; p.style.left=x+'px'; p.style.top=y+'px';
    p.style.background=cols[i%cols.length]; fx.appendChild(p);
    const ang=Math.random()*Math.PI*2, dist=rand(60,170), sc=rand(.6,1.8);
    p.animate([{transform:'translate(0,0) scale(0) rotate(0)',opacity:1},
      {transform:`translate(${Math.cos(ang)*dist*.7}px,${Math.sin(ang)*dist*.7}px) scale(${sc}) rotate(120deg)`,opacity:1,offset:.5},
      {transform:`translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist+30}px) scale(0) rotate(240deg)`,opacity:0}],
      {duration:rand(800,1300),easing:'ease-out'}).onfinish=()=>p.remove();
  }
}
function flyStar(x,y,done){
  const target = centerOf($('#stars .gstar'));
  const s=document.createElement('div'); s.className='flystar'; s.innerHTML='<span class="gstar"></span>'; s.style.left=x+'px'; s.style.top=y+'px'; fx.appendChild(s);
  s.animate([{transform:'translate(0,0) scale(.2) rotate(0)',opacity:0},
    {transform:'translate(0,-40px) scale(1.7) rotate(180deg)',opacity:1,offset:.35},
    {transform:'translate(0,-40px) scale(1.7) rotate(360deg)',opacity:1,offset:.6},
    {transform:`translate(${target.x-x}px,${target.y-y}px) scale(.45) rotate(720deg)`,opacity:1}],
    {duration:1500,easing:'ease-in-out'}).onfinish=()=>{ s.remove(); done&&done(); };
}
function confetti(waves=3){
  const cols=['#ff5d8f','#ffd22e','#5cc8ff','#7bdc65','#b47bff','#ff9f1c'];
  const W=app.clientWidth, H=app.clientHeight;
  for(let w=0;w<waves;w++) later(()=>{
    for(let i=0;i<46;i++){
      const c=document.createElement('div'); c.className='conf'; c.style.left=rand(0,W)+'px'; c.style.background=cols[i%cols.length]; fx.appendChild(c);
      c.animate([{transform:'translateY(0) rotate(0) rotateX(0)',opacity:1},
        {transform:`translate(${rand(-80,80)}px,${H+40}px) rotate(${rand(300,900)}deg) rotateX(720deg)`,opacity:1}],
        {duration:rand(2200,4200),delay:rand(0,500),easing:'cubic-bezier(.3,.2,.6,1)',fill:'both'}).onfinish=()=>c.remove();
    }
  }, w*1300);
}

/* ---------- Game ---------- */
let order=[], round=0, stars=0, target=null, locked=true, playing=false;
const art = a => a.g==='m' ? 'el' : 'la';
const al  = a => a.g==='m' ? 'al' : 'a la';
const QUESTIONS = [
  a=>`¿Dónde está ${art(a)} ${a.n}?`,
  a=>`¿Puedes encontrar ${al(a)} ${a.n}?`,
  a=>`¡Toca ${art(a)} ${a.n}!`,
  a=>`¿Me ayudas a encontrar ${al(a)} ${a.n}?`,
  a=>`¿Dónde se esconde ${art(a)} ${a.n}?`
];
const PRAISE = ['¡Muy bien!','¡Excelente!','¡Lo lograste!','¡Genial!','¡Eso es!','¡Bravo!','¡Fantástico!'];
const OOPS = ['¡Casi! Inténtalo otra vez, ¡tú puedes!','¡Uy, ese no es! Prueba con otro.','¡No te rindas! Mira bien e inténtalo de nuevo.','¡Tú puedes! Busca otra vez.','¡Ánimo! Ese no era, ¡sigue buscando!'];
let lastQ = -1;

function setBubble(text, cls=''){ bubble.className=cls; void bubble.offsetWidth; bubble.classList.add('pop'); bubble.textContent=text; }
function updateHud(){ $('#cnt').textContent = stars; $('#progbar').style.width = (round/TOTAL*100)+'%'; }

function startGame(){
  clearTimers(); fx.innerHTML='';
  stars=0; round=0; playing=true;
  order = shuffle(ANIMALS).slice(0,TOTAL);
  $('#tot').textContent = TOTAL;
  app.className='s-play'; updateHud();
  later(nextRound, 700);
}
let currentQuestion='';
function nextRound(){
  if(round>=TOTAL) return finishGame();
  target = order[round];
  const others = shuffle(ANIMALS.filter(a=>a!==target)).slice(0,2);
  const opts = shuffle([target,...others]);
  choices.innerHTML='';
  opts.forEach(a=>{
    const b=document.createElement('button'); b.className='animal'; b.type='button'; b.setAttribute('aria-label', a.n);
    b.innerHTML=a.draw(); b.addEventListener('click',()=>choose(a,b)); choices.appendChild(b);
  });
  let qi; do{ qi=Math.floor(Math.random()*QUESTIONS.length); }while(qi===lastQ); lastQ=qi;
  currentQuestion = QUESTIONS[qi](target);
  setBubble(currentQuestion); nicoDo('talk'); say(currentQuestion);
  locked=false; updateHud();
}
function choose(a,btn){
  if(locked||!playing) return; audio();
  if(a===target){
    locked=true; sfx.good(); btn.classList.add('win');
    const c=centerOf(btn); sparkles(c.x,c.y-c.h*.1,30);
    [...choices.children].forEach(b=>{ if(b!==btn) b.classList.add('fade'); });
    const msg = `${PRAISE[Math.floor(Math.random()*PRAISE.length)]} Es ${art(a)} ${a.n}.`;
    setBubble(msg,'good'); nicoDo('cheer'); say(msg);
    later(()=>{ sfx.star(); flyStar(c.x,c.y,()=>{ stars++; round++; const st=$('#stars'); st.classList.remove('pulse'); void st.offsetWidth; st.classList.add('pulse'); updateHud(); const t=centerOf($('#stars .gstar')); sparkles(t.x,t.y,12); sfx.pop(); }); }, 500);
    later(nextRound, 3300);
  } else {
    btn.classList.add('shake'); sfx.bad();
    later(()=>btn.classList.add('tried'),450);
    const msg = OOPS[Math.floor(Math.random()*OOPS.length)];
    setBubble(msg,'bad'); nicoDo('oops'); say(msg);
    later(()=>{ if(!locked && playing) setBubble(currentQuestion); }, 3600);
  }
}
function finishGame(){
  playing=false; locked=true; choices.innerHTML='';
  const fs=$('#finalStars'); fs.innerHTML='';
  for(let i=0;i<TOTAL;i++){ const s=document.createElement('span'); s.className='gstar'; s.style.animationDelay=(.5+i*.12)+'s'; fs.appendChild(s); }
  $('#finalMsg').textContent = `¡Encontraste ${stars} animales y ganaste ${stars} estrellas!`;
  app.className='s-final'; sfx.win(); confetti(3);
  later(()=>nicoDo('cheer'),500); later(()=>nicoDo('cheer'),1800);
  later(()=>say('¡Felicidades! ¡Encontraste a todos los animales! ¡Eres increíble!'),900);
  for(let i=0;i<TOTAL;i++) later(()=>tone(700+i*90,0,.2,'sine',.1),600+i*120);
}

/* ---------- Buttons ---------- */
$('#startBtn').addEventListener('click',()=>{ audio(); sfx.pop(); nicoDo('wave'); say('¡Hola! Soy Nico. ¡Vamos a encontrar a los animales!'); later(startGame,2600); $('#startBtn').disabled=true; });
$('#againBtn').addEventListener('click',()=>{ audio(); sfx.pop(); try{speechSynthesis.cancel();}catch(e){} startGame(); });
$('#speakBtn').addEventListener('click',()=>{ audio(); if(playing){ nicoDo('talk'); say(currentQuestion);} });
$('#muteBtn').addEventListener('click',()=>{ soundOn=!soundOn; $('#muteBtn').textContent = soundOn?'🎵':'🔇'; if(!soundOn){ try{speechSynthesis.cancel();}catch(e){} } else { sfx.pop(); } });
document.addEventListener('contextmenu',e=>e.preventDefault());
if('speechSynthesis' in window){ speechSynthesis.getVoices(); }
later(()=>nicoDo('wave'),600);
</script>
